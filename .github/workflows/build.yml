name: Build EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "OvenProfileAnalyzer" --collect-all ttkbootstrap oven_profile_analyzer.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OvenProfileAnalyzer
        path: dist/OvenProfileAnalyzer.exe
